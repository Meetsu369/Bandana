name: bandana
description: "Bandana – AI-powered IoT wearable for Human Activity Recognition"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2

  # Dependency injection
  get_it: ^9.2.1

  # BLE communication
  flutter_blue_plus: ^2.3.0

  # Charts & visualization
  fl_chart: ^1.2.0

  # Machine Learning (on-device)
  ml_algo: ^16.18.1
  ml_dataframe: ^1.6.0

  # Local database (Drift – type-safe SQL)
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # UI
  google_fonts: ^6.2.0

  # Permissions
  permission_handler: ^11.3.0

  # Persistent storage
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Drift code generation
  drift_dev: ^2.22.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
