; PlatformIO Configuration for Bandana ESP32-C3 Firmware
; 
; Usage:
;   pio run -e wrist   # Build for WRIST (BLE + SD, no Wi-Fi)
;   pio run -e ankle   # Build for ANKLE (BLE + SD, no Wi-Fi)
;   pio run -t upload -e wrist  # Upload to WRIST
;
; Wi-Fi configuration (set via build flags or environment variables):
;   pio run -e wrist -D WIFI_SSID="your_ssid" -D WIFI_PASS="your_pass" -D WIFI_ENDPOINT="http://host:port/path"
;
; NOTE: Wi-Fi HTTP POST blocks main loop (50-500ms). Standard builds disable Wi-Fi.
; Use 'wifi-enabled' or 'wifi-only' environments for Wi-Fi testing.

[platformio]
default_envs = wrist

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = 
    h2zero/NimBLE-Arduino@^2.5.0
build_flags = 
    -D SAMPLE_INTERVAL_MS=25
    -D DEBUG=1
    -D ENABLE_BLE=1
    -D ENABLE_SD=1
    -D ENABLE_WIFI=0

[env:wrist]
build_flags = ${env.build_flags} -D BAND_ROLE_WRIST

[env:ankle]
build_flags = ${env.build_flags} -D BAND_ROLE_ANKLE

; Wi-Fi enabled builds (for testing only - HTTP POST blocks 40Hz loop)
; WARNING: Wi-Fi transport performs synchronous HTTP POST (50-500ms blocking)
; For production 40Hz operation, move Wi-Fi to FreeRTOS task first.
[env:wrist-wifi]
build_flags = ${env.build_flags} -D BAND_ROLE_WRIST -D ENABLE_WIFI=1

[env:ankle-wifi]
build_flags = ${env.build_flags} -D BAND_ROLE_ANKLE -D ENABLE_WIFI=1

; Wi-Fi only build (no BLE, no SD)
[env:wifi-only]
build_flags = ${env.build_flags} -D BAND_ROLE_WRIST -D ENABLE_BLE=0 -D ENABLE_SD=0 -D ENABLE_WIFI=1

; BLE + Wi-Fi only (no SD)
[env:ble-wifi]
build_flags = ${env.build_flags} -D BAND_ROLE_WRIST -D ENABLE_BLE=1 -D ENABLE_SD=0 -D ENABLE_WIFI=1

; No transport (sensor only, for testing)
[env:sensor-only]
build_flags = ${env.build_flags} -D BAND_ROLE_WRIST -D ENABLE_BLE=0 -D ENABLE_SD=0 -D ENABLE_WIFI=0