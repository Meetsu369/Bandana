; PlatformIO Configuration for Bandana ESP32-C3 Firmware
; 
; Usage:
;   pio run            # Build unified production binary (auto role detection on GPIO 3)
;   pio run -t upload  # Flash unified binary to any node (wrist or ankle)

[platformio]
default_envs = prod

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = 
    h2zero/NimBLE-Arduino@^2.5.0
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D SAMPLE_INTERVAL_US=20000
    -D DEBUG=1

; Unified Production Binary (GPIO 3 auto-detects Wrist vs Ankle)
[env:prod]
build_flags = ${env.build_flags}

; Legacy aliases (map to unified production build)
[env:wrist]
build_flags = ${env.build_flags}

[env:ankle]
build_flags = ${env.build_flags}