; PlatformIO Configuration for Bandana ESP32-C3 Firmware
; 
; Usage:
;   pio run -e wrist   # Build for WRIST
;   pio run -e ankle   # Build for ANKLE
;   pio run -t upload -e wrist  # Upload to WRIST

[platformio]
default_envs = wrist

[env]
platform = espressif32
board = esp32c3_devkitm
framework = arduino
monitor_speed = 115200
lib_deps = 
    nimble-arduino/NimBLE-Arduino@^2.0.0
build_flags = 
    -D SAMPLE_INTERVAL_MS=25
    -D DEBUG=1

[env:wrist]
build_flags = ${env.build_flags} -D BAND_ROLE_WRIST

[env:ankle]
build_flags = ${env.build_flags} -D BAND_ROLE_ANKLE